name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: build the engine for the page
        run: |
          moon update
          moon build --target js --release src/examples/playground
          mkdir -p docs/engine
          cp _build/js/release/build/examples/playground/playground.js docs/engine/moonpug.js

      - name: set up node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: generate the built-ins reference page
        run: node scripts/gen_builtins.mjs

      - name: generate the API reference page
        run: python scripts/gen_api.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
