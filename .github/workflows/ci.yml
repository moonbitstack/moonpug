name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/[0-9]*/; do
            moon run "$dir" --target native > /dev/null
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code --ignore-cr-at-eol

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code --ignore-cr-at-eol

      - name: the API page follows the interfaces
        run: |
          python3 scripts/gen_api.py || python scripts/gen_api.py
          git diff --exit-code --ignore-cr-at-eol docs/api.html

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      # The same template, rendered by this engine and by the implementation the syntax comes
      # from, has to come out byte for byte. Both references are installed at a pinned version
      # and asked for their own output; nothing here reads the expectations in the repository.
      - name: the engine agrees with the reference implementations
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/refs"
          "$RUNNER_TEMP/refs/bin/pip" install --quiet "jinja2==3.1.6"
          npm install --no-save --no-package-lock pug@3.0.4
          moon build --target js --release src/examples/playground
          node scripts/differential/render_cases.mjs \
            _build/js/release/build/examples/playground/playground.js "$RUNNER_TEMP/rendered.json"
          "$RUNNER_TEMP/refs/bin/python" scripts/differential/check_jinja.py "$RUNNER_TEMP/rendered.json"
          node scripts/differential/check_pug.mjs "$RUNNER_TEMP/rendered.json"

      # One page written three ways has to come out as one document. The three are compared
      # with parse5, the parser the HTML specification's own tests use, not as text.
      - name: one page in three languages is one document
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --no-package-lock parse5@7
          moon run src/examples/09-same-page --target native -- --json > "$RUNNER_TEMP/same-page.json"
          node scripts/check_same_page.mjs "$RUNNER_TEMP/same-page.json"
